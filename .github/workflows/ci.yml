name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 왜: 로컬은 H2지만 CI는 실제 PostgreSQL로 Flyway 마이그레이션까지 검증한다.
    # 어디: 아래 SPRING_DATASOURCE_* 환경변수가 application.yml의 H2 설정을 덮어쓴다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: slackclone
          POSTGRES_USER: slackclone
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slackclone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/slackclone
      SPRING_DATASOURCE_USERNAME: slackclone
      SPRING_DATASOURCE_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: 테스트 + ArchUnit 포함 전체 빌드
        run: ./gradlew build --no-daemon
